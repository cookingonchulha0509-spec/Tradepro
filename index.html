<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appliance Vibration Diagnostic Tool</title>
    <style>
        /* Stealth UI - Matte Black & Charcoal */
        :root {
            --bg-color: #121212;
            --panel-bg: #1c1c1c;
            --text-main: #e0e0e0;
            --text-muted: #777777;
            --accent-neutral: #444444;
            --accent-scan: #3498db;
            --accent-success: #2ecc71;
            --accent-danger: #e74c3c;
            --accent-warning: #f1c40f;
            --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'SF Mono', Consolas, 'Liberation Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #header {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
        }

        #header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        #header p {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/3;
            background-color: #000;
            border: 1px solid var(--accent-neutral);
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        video { display: none; } /* Hidden, drawn directly to canvas */

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UI Overlays */
        #shake-warning {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: none;
            z-index: 20;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        #status-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 28, 0.95);
            padding: 15px 25px;
            border: 1px solid var(--accent-neutral);
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-align: center;
            display: none;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        #progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 5px;
            background-color: var(--accent-scan);
            width: 0%;
            transition: width 0.1s linear;
            z-index: 15;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        #controls {
            margin-top: 30px;
            z-index: 10;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 14px 28px;
            font-size: 0.95rem;
            font-family: var(--font-stack);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: var(--text-main);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Appliance Diagnostic Scanner</h1>
        <p>TARGET: 5Hz - 30Hz | GRID: 20x20 | STATUS: <span id="sys-status">INIT</span></p>
    </div>

    <div id="scanner-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="main-canvas"></canvas>
        <div class="scanline"></div>
        <div id="progress-bar"></div>
        <div id="shake-warning">⚠️ HOLD DEVICE STEADY - DATA PAUSED</div>
        <div id="status-overlay"></div>
    </div>

    <div id="controls">
        <button id="start-btn" disabled>Start Diagnostic Scan</button>
    </div>

    <script>
        /**
         * CONFIGURATION
         */
        const CONFIG = {
            scanDurationMs: 7000,         // 7-second analysis window
            gridSize: 20,                 // 20x20 grid (400 blocks)
            targetBoxRatio: 0.6,          // Targeting box takes up 60% of canvas
            freqMin: 5,                   // Min frequency (Hz) for home appliances
            freqMax: 30,                  // Max frequency (Hz) for home appliances
            anomalyThreshold: 2.0,        // FFT Amplitude threshold for anomaly detection
            shakeThreshold: 1.8           // m/s^2 delta threshold to detect hand shake
        };

        const state = {
            status: 'INIT', // INIT, IDLE, SCANNING, RESULT
            stream: null,
            scanStartTime: 0,
            
            // Frame tracking
            totalFramesCaptured: 0,
            elapsedCaptureTimeMs: 0,
            lastFrameTimestamp: 0,
            
            // 2D Array: timeSeriesData[blockIndex][frameIndex]
            timeSeriesData: [], 
            
            // Device Motion
            isShaking: false,
            lastAccel: { x: null, y: null, z: null },
            
            // Results
            failingBlocks: [],
            scanResult: null
        };

        // DOM Elements
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const startBtn = document.getElementById('start-btn');
        const statusOverlay = document.getElementById('status-overlay');
        const shakeWarning = document.getElementById('shake-warning');
        const sysStatus = document.getElementById('sys-status');
        const progressBar = document.getElementById('progress-bar');

        /**
         * 1. WEBRTC CAMERA SETUP
         */
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment', // Rear camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 60 } // Request high framerate for better Nyquist limit
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                state.stream = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    state.status = 'IDLE';
                    sysStatus.innerText = 'READY';
                    startBtn.disabled = false;
                    
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                console.error("Camera access error:", err);
                sysStatus.innerText = 'CAMERA ERROR';
                sysStatus.style.color = 'var(--accent-danger)';
                alert("Camera permission is required to analyze vibrations.");
            }
        }

        /**
         * 2. ANTI-SHAKE DEVICE MOTION TRACKING
         * We measure the delta of acceleration (including gravity) to isolate hand-shakes.
         */
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc || acc.x === null) return;

            if (state.lastAccel.x !== null) {
                const dx = acc.x - state.lastAccel.x;
                const dy = acc.y - state.lastAccel.y;
                const dz = acc.z - state.lastAccel.z;
                
                // Calculate magnitude of acceleration delta
                const delta = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                if (delta > CONFIG.shakeThreshold) {
                    state.isShaking = true;
                } else {
                    state.isShaking = false;
                }
            }
            state.lastAccel = { x: acc.x, y: acc.y, z: acc.z };
        }

        // Handle iOS 13+ permission requirements for DeviceMotion
        async function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                    }
                } catch (e) {
                    console.error("DeviceMotion permission denied:", e);
                }
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        /**
         * 3. RENDER & DATA CAPTURE LOOP
         */
        function renderLoop(timestamp) {
            if (!state.stream) return;

            const w = canvas.width;
            const h = canvas.height;
            
            // Targeting box dimensions
            const boxW = w * CONFIG.targetBoxRatio;
            const boxH = h * CONFIG.targetBoxRatio;
            const boxX = (w - boxW) / 2;
            const boxY = (h - boxH) / 2;

            // Draw underlying video frame
            ctx.drawImage(video, 0, 0, w, h);

            if (state.status === 'SCANNING') {
                const totalElapsedMs = timestamp - state.scanStartTime;
                const progress = Math.min((totalElapsedMs / CONFIG.scanDurationMs) * 100, 100);
                progressBar.style.width = `${progress}%`;

                // Anti-Shake Logic
                if (state.isShaking) {
                    shakeWarning.style.display = 'block';
                    // PAUSE pixel data collection for this frame (do not extract or push data)
                } else {
                    shakeWarning.style.display = 'none';
                    
                    // Collect Frame Data
                    const frameData = ctx.getImageData(boxX, boxY, boxW, boxH);
                    extractGridIntensities(frameData, boxW, boxH);
                    
                    if (state.lastFrameTimestamp !== 0) {
                        state.elapsedCaptureTimeMs += (timestamp - state.lastFrameTimestamp);
                    }
                    state.lastFrameTimestamp = timestamp;
                    state.totalFramesCaptured++;
                }

                // Visual Overlays during scan
                drawGridOverlay(boxX, boxY, boxW, boxH, 'rgba(255, 255, 255, 0.15)');
                drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-scan)', false);

                // Check for completion
                if (totalElapsedMs >= CONFIG.scanDurationMs) {
                    progressBar.style.width = '0%';
                    shakeWarning.style.display = 'none';
                    analyzeData();
                } else {
                    requestAnimationFrame(renderLoop);
                }

            } else if (state.status === 'IDLE' || state.status === 'INIT') {
                drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-neutral)', false);
                requestAnimationFrame(renderLoop);
                
            } else if (state.status === 'RESULT') {
                // Persistent Result Visualization
                if (state.scanResult.status === 'FAIL') {
                    // Alpha masking: Darken the whole canvas
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(0, 0, w, h);
                    
                    // Highlight target box by drawing original video feed back (still frame)
                    ctx.drawImage(video, boxX, boxY, boxW, boxH, boxX, boxY, boxW, boxH);
                    
                    // Draw red glowing bounding boxes exactly over failing blocks
                    drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-neutral)', false);
                    drawAnomalies(boxX, boxY, boxW, boxH);
                } else {
                    drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-success)', true);
                }
            }
        }

        /**
         * Extract Grayscale Pixel Intensity for each of the 400 (20x20) blocks
         */
        function extractGridIntensities(imageData, width, height) {
            const data = imageData.data;
            const blockW = width / CONFIG.gridSize;
            const blockH = height / CONFIG.gridSize;
            
            const numBlocks = CONFIG.gridSize * CONFIG.gridSize;
            const blockSums = new Float64Array(numBlocks);
            const blockCounts = new Uint32Array(numBlocks);

            for (let y = 0; y < height; y++) {
                const gridY = Math.floor(y / blockH);
                if (gridY >= CONFIG.gridSize) continue;
                
                for (let x = 0; x < width; x++) {
                    const gridX = Math.floor(x / blockW);
                    if (gridX >= CONFIG.gridSize) continue;
                    
                    const index = (y * Math.floor(width) + x) * 4;
                    // Luma formula for grayscale
                    const gray = 0.299 * data[index] + 0.587 * data[index+1] + 0.114 * data[index+2];
                    
                    const blockIndex = gridY * CONFIG.gridSize + gridX;
                    blockSums[blockIndex] += gray;
                    blockCounts[blockIndex]++;
                }
            }

            // Calculate average and push to time-series
            for (let i = 0; i < numBlocks; i++) {
                const avg = blockSums[i] / blockCounts[i];
                state.timeSeriesData[i].push(avg);
            }
        }

        /**
         * 4. PURE JS FAST FOURIER TRANSFORM (Cooley-Tukey Radix-2)
         */
        function computeFFT(real, imag) {
            const n = real.length;
            
            // Bit-reversal
            for (let i = 0, j = 0; i < n; i++) {
                if (j > i) {
                    let tR = real[i], tI = imag[i];
                    real[i] = real[j]; imag[i] = imag[j];
                    real[j] = tR; imag[j] = tI;
                }
                let m = n >> 1;
                while (m >= 1 && j >= m) { j -= m; m >>= 1; }
                j += m;
            }

            // Butterfly calculation
            for (let size = 2; size <= n; size *= 2) {
                const halfSize = size / 2;
                const angle = -2 * Math.PI / size;
                const wRe = Math.cos(angle), wIm = Math.sin(angle);
                
                for (let i = 0; i < n; i += size) {
                    let uRe = 1, uIm = 0;
                    for (let j = 0; j < halfSize; j++) {
                        const idx = i + j;
                        const idxHalf = idx + halfSize;
                        
                        const tRe = uRe * real[idxHalf] - uIm * imag[idxHalf];
                        const tIm = uRe * imag[idxHalf] + uIm * real[idxHalf];
                        
                        real[idxHalf] = real[idx] - tRe;
                        imag[idxHalf] = imag[idx] - tIm;
                        real[idx] += tRe;
                        imag[idx] += tIm;
                        
                        const nextURe = uRe * wRe - uIm * wIm;
                        uIm = uRe * wIm + uIm * wRe;
                        uRe = nextURe;
                    }
                }
            }
        }

        function nextPowerOf2(n) {
            return Math.pow(2, Math.ceil(Math.log2(n)));
        }

        /**
         * 5. CORE MATHEMATICAL ANALYSIS (EVM & FFT)
         */
        function analyzeData() {
            state.status = 'ANALYZING';
            sysStatus.innerText = 'PROCESSING FFT...';
            
            const numFrames = state.totalFramesCaptured;
            if (numFrames < 10) {
                alert("Scan failed: Excessive shaking prevented data collection. Please try again.");
                resetToIdle();
                return;
            }

            // Calculate actual FPS of the successfully captured frames
            const actualDurationSec = state.elapsedCaptureTimeMs / 1000;
            const actualFPS = numFrames / actualDurationSec;
            
            // Nyquist check
            if (actualFPS / 2 < CONFIG.freqMax) {
                console.warn(`Nyquist limit (${(actualFPS/2).toFixed(1)}Hz) is below target max ${CONFIG.freqMax}Hz due to low camera FPS.`);
            }

            const numBlocks = CONFIG.gridSize * CONFIG.gridSize;
            const fftSize = nextPowerOf2(numFrames);
            
            let globalMaxAmplitude = 0;
            let globalPeakFrequency = 0;
            state.failingBlocks = [];

            for (let b = 0; b < numBlocks; b++) {
                const signal = state.timeSeriesData[b];
                
                // Remove DC Offset (Mean)
                const mean = signal.reduce((acc, val) => acc + val, 0) / numFrames;
                
                const real = new Float64Array(fftSize);
                const imag = new Float64Array(fftSize);
                
                for (let i = 0; i < fftSize; i++) {
                    if (i < numFrames) {
                        // Apply Hanning Window to minimize spectral leakage
                        const windowMultiplier = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (numFrames - 1)));
                        real[i] = (signal[i] - mean) * windowMultiplier;
                    } else {
                        real[i] = 0; // Zero pad to power of 2
                    }
                }
                
                computeFFT(real, imag);
                
                let blockMaxAmp = 0;
                let blockPeakFreq = 0;
                
                // Search for peak frequency strictly inside 5Hz - 30Hz band
                for (let i = 1; i < fftSize / 2; i++) {
                    const freq = i * (actualFPS / fftSize);
                    
                    if (freq >= CONFIG.freqMin && freq <= CONFIG.freqMax) {
                        // Magnitude Calculation
                        const magnitude = Math.sqrt(real[i]**2 + imag[i]**2);
                        // Normalize (account for zero-padding and windowing loss)
                        const normalizedMag = (magnitude / (numFrames / 2)) * 2;
                        
                        if (normalizedMag > blockMaxAmp) {
                            blockMaxAmp = normalizedMag;
                            blockPeakFreq = freq;
                        }
                    }
                }
                
                if (blockMaxAmp > globalMaxAmplitude) {
                    globalMaxAmplitude = blockMaxAmp;
                    globalPeakFrequency = blockPeakFreq;
                }
                
                // Flag anomalies exceeding threshold
                if (blockMaxAmp > CONFIG.anomalyThreshold) {
                    state.failingBlocks.push({
                        index: b,
                        amplitude: blockMaxAmp,
                        frequency: blockPeakFreq
                    });
                }
            }

            const isFaulty = state.failingBlocks.length > 0;
            
            state.scanResult = {
                timestamp: new Date().toISOString(),
                status: isFaulty ? 'FAIL' : 'PASS',
                peakFrequency: isFaulty ? globalPeakFrequency.toFixed(2) : '0.00',
                maxAmplitude: globalMaxAmplitude.toFixed(2)
            };

            logToDatabase(state.scanResult);
            showResults(isFaulty);
        }

        /**
         * 6. RESULTS & LOGGING
         */
        function showResults(isFaulty) {
            state.status = 'RESULT';
            sysStatus.innerText = isFaulty ? 'FAULT DETECTED' : 'SYSTEM OPTIMAL';
            sysStatus.style.color = isFaulty ? 'var(--accent-danger)' : 'var(--accent-success)';
            
            statusOverlay.style.display = 'block';
            statusOverlay.style.borderColor = isFaulty ? 'var(--accent-danger)' : 'var(--accent-success)';
            
            if (isFaulty) {
                statusOverlay.style.color = 'var(--accent-danger)';
                statusOverlay.innerHTML = `⚠️ MECHANICAL FAULT DETECTED<br>Freq: ${state.scanResult.peakFrequency}Hz | Mag: ${state.scanResult.maxAmplitude}`;
            } else {
                statusOverlay.style.color = 'var(--accent-success)';
                statusOverlay.innerHTML = `✓ STATUS: OPTIMAL. NO ANOMALOUS VIBRATIONS.`;
            }

            startBtn.disabled = false;
            startBtn.innerText = "Initiate New Scan";
        }

        function logToDatabase(result) {
            const logEntry = {
                timestamp: result.timestamp,
                status: result.status,
                peakFrequency: parseFloat(result.peakFrequency)
            };

            let logs = [];
            try {
                const stored = localStorage.getItem('vibration_scan_logs');
                if (stored) logs = JSON.parse(stored);
            } catch(e) {}
            
            logs.push(logEntry);
            localStorage.setItem('vibration_scan_logs', JSON.stringify(logs));
            console.log("Logged strictly to localStorage:", logEntry);
        }

        /**
         * 7. CANVAS DRAWING HELPERS
         */
        function drawTargetBox(x, y, w, h, color, glowing) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = glowing ? 15 : 0;
            ctx.shadowColor = glowing ? color : 'transparent';
            
            const len = 40;
            ctx.beginPath();
            // TL
            ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
            // TR
            ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
            // BR
            ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
            // BL
            ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        function drawGridOverlay(x, y, w, h, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const stepX = w / CONFIG.gridSize;
            const stepY = h / CONFIG.gridSize;
            
            for (let i = 1; i < CONFIG.gridSize; i++) {
                ctx.moveTo(x + i * stepX, y); ctx.lineTo(x + i * stepX, y + h);
                ctx.moveTo(x, y + i * stepY); ctx.lineTo(x + w, y + i * stepY);
            }
            ctx.stroke();
        }

        function drawAnomalies(x, y, w, h) {
            const blockW = w / CONFIG.gridSize;
            const blockH = h / CONFIG.gridSize;
            
            ctx.strokeStyle = 'var(--accent-danger)';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'var(--accent-danger)';
            ctx.shadowBlur = 12;
            
            for (const block of state.failingBlocks) {
                const gridX = block.index % CONFIG.gridSize;
                const gridY = Math.floor(block.index / CONFIG.gridSize);
                
                const rectX = x + (gridX * blockW);
                const rectY = y + (gridY * blockH);
                
                // Draw glowing RED BOUNDING BOX strictly over the specific grid block
                ctx.strokeRect(rectX, rectY, blockW, blockH);
                
                // Draw inner crosshair for precision feel
                ctx.beginPath();
                ctx.moveTo(rectX + blockW/2, rectY + blockH/2 - 6);
                ctx.lineTo(rectX + blockW/2, rectY + blockH/2 + 6);
                ctx.moveTo(rectX + blockW/2 - 6, rectY + blockH/2);
                ctx.lineTo(rectX + blockW/2 + 6, rectY + blockH/2);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function resetToIdle() {
            state.status = 'IDLE';
            sysStatus.innerText = 'READY';
            sysStatus.style.color = 'var(--text-main)';
            startBtn.disabled = false;
            statusOverlay.style.display = 'none';
            shakeWarning.style.display = 'none';
            progressBar.style.width = '0%';
        }

        /**
         * EVENT LISTENERS
         */
        startBtn.addEventListener('click', async () => {
            if (state.status !== 'IDLE' && state.status !== 'RESULT') return;
            
            // On first interaction, request DeviceMotion permissions if required (iOS)
            await requestMotionPermission();

            // Reset and start
            state.status = 'SCANNING';
            sysStatus.innerText = 'SCAN IN PROGRESS...';
            sysStatus.style.color = 'var(--accent-scan)';
            startBtn.disabled = true;
            statusOverlay.style.display = 'none';
            
            state.totalFramesCaptured = 0;
            state.elapsedCaptureTimeMs = 0;
            state.lastFrameTimestamp = 0;
            state.scanStartTime = performance.now();
            
            // Initialize 400 empty arrays for block data
            const numBlocks = CONFIG.gridSize * CONFIG.gridSize;
            state.timeSeriesData = Array.from({ length: numBlocks }, () => []);
            
            // Re-trigger loop if coming from Result static state
            requestAnimationFrame(renderLoop);
        });

        // Initialize on Load
        window.addEventListener('load', initCamera);

    </script>
</body>
</html>
