<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Machine Vibration Diagnostic Tool</title>
    <style>
        /* Dark & Stealth UI - Military-grade, high-end diagnostic aesthetic */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-neutral: #555555;
            --accent-scan: #4a90e2;
            --accent-success: #2ecc71;
            --accent-danger: #e74c3c;
            --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        #app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        #app-header p {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        #diagnostic-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background-color: #000;
            border: 1px solid var(--accent-neutral);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            display: none; /* Hidden, we draw to canvas */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--accent-neutral);
            padding: 12px 24px;
            font-size: 0.9rem;
            font-family: var(--font-stack);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: var(--text-muted);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #start-btn {
            border-left: 3px solid var(--text-main);
        }

        #status-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.85);
            padding: 10px 20px;
            border: 1px solid var(--accent-neutral);
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-align: center;
            backdrop-filter: blur(4px);
            display: none;
            z-index: 20;
            white-space: nowrap;
        }
        
        #scan-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background-color: var(--accent-scan);
            width: 0%;
            transition: width 0.1s linear;
            z-index: 15;
        }

        /* Scan Line Animation Overlay */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>Vibration Diagnostic Tool</h1>
        <p>SYS.VER: EVM-FFT-1.0.4 | STATUS: <span id="sys-status">INITIALIZING</span></p>
    </div>

    <div id="diagnostic-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="main-canvas"></canvas>
        <div class="scanline"></div>
        <div id="scan-progress-bar"></div>
        <div id="status-overlay"></div>
    </div>

    <div id="controls">
        <button id="start-btn" disabled>Start Diagnostic Scan</button>
    </div>

    <script>
        /**
         * Core Application State & Config
         */
        const CONFIG = {
            scanDurationMs: 5000,         // 5 seconds analysis window
            gridSize: 16,                 // 16x16 targeting box grid
            targetBoxRatio: 0.5,          // Box takes up 50% of canvas dimension
            freqMin: 5,                   // Minimum frequency to look for (Hz)
            freqMax: 60,                  // Maximum frequency (Hz) - Limited by Nyquist (FPS/2)
            anomalyThreshold: 8.5         // FFT amplitude threshold for identifying anomalies
        };

        const state = {
            status: 'INIT', // INIT, IDLE, SCANNING, ANALYZING, RESULT
            cameraStream: null,
            scanStartTime: 0,
            frameCount: 0,
            frameTimestamps: [],
            // 2D Array storing time-series data for each grid cell
            // timeSeriesData[cellIndex][frameIndex]
            timeSeriesData: [], 
            scanResult: null,
            failingCells: []
        };

        /**
         * DOM Elements
         */
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const startBtn = document.getElementById('start-btn');
        const statusOverlay = document.getElementById('status-overlay');
        const sysStatus = document.getElementById('sys-status');
        const progressBar = document.getElementById('scan-progress-bar');

        /**
         * Initialization - WebRTC Camera Access
         */
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment', // Prefer rear camera for industrial scanning
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                state.cameraStream = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    // Match canvas internal resolution to video aspect ratio
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    state.status = 'IDLE';
                    sysStatus.innerText = 'READY';
                    startBtn.disabled = false;
                    
                    // Start render loop
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                console.error("Camera access failed:", err);
                sysStatus.innerText = 'CAMERA ERROR';
                sysStatus.style.color = 'var(--accent-danger)';
                alert("Camera access is required for the diagnostic tool.");
            }
        }

        /**
         * Pure JavaScript Fast Fourier Transform (Cooley-Tukey Radix-2)
         * Modifies real and imag arrays in place. Arrays must be power of 2 length.
         */
        function computeFFT(real, imag) {
            const n = real.length;
            
            // Bit-reversal permutation
            for (let i = 0, j = 0; i < n; i++) {
                if (j > i) {
                    let tempRe = real[i];
                    real[i] = real[j];
                    real[j] = tempRe;
                    let tempIm = imag[i];
                    imag[i] = imag[j];
                    imag[j] = tempIm;
                }
                let m = n >> 1;
                while (m >= 1 && j >= m) {
                    j -= m;
                    m >>= 1;
                }
                j += m;
            }

            // Cooley-Tukey calculation
            for (let size = 2; size <= n; size *= 2) {
                const halfSize = size / 2;
                const angle = -2 * Math.PI / size;
                const wRe = Math.cos(angle);
                const wIm = Math.sin(angle);
                
                for (let i = 0; i < n; i += size) {
                    let uRe = 1;
                    let uIm = 0;
                    
                    for (let j = 0; j < halfSize; j++) {
                        const evenRe = real[i + j];
                        const evenIm = imag[i + j];
                        const oddRe = real[i + j + halfSize];
                        const oddIm = imag[i + j + halfSize];
                        
                        const tRe = uRe * oddRe - uIm * oddIm;
                        const tIm = uRe * oddIm + uIm * oddRe;
                        
                        real[i + j] = evenRe + tRe;
                        imag[i + j] = evenIm + tIm;
                        real[i + j + halfSize] = evenRe - tRe;
                        imag[i + j + halfSize] = evenIm - tIm;
                        
                        const nextURe = uRe * wRe - uIm * wIm;
                        const nextUIm = uRe * wIm + uIm * wRe;
                        uRe = nextURe;
                        uIm = nextUIm;
                    }
                }
            }
        }

        /**
         * Next Power of 2 Helper
         */
        function nextPowerOf2(n) {
            let count = 0;
            if (n && !(n & (n - 1))) return n; // Already power of 2
            while( n != 0) {
                n >>= 1;
                count += 1;
            }
            return 1 << count;
        }

        /**
         * Main Analysis Logic (Signal Processing)
         */
        function analyzeData() {
            state.status = 'ANALYZING';
            sysStatus.innerText = 'ANALYZING SIGNAL...';
            
            const totalFrames = state.frameCount;
            const elapsedTimeSec = (state.frameTimestamps[totalFrames - 1] - state.frameTimestamps[0]) / 1000;
            const actualFps = totalFrames / elapsedTimeSec;
            
            console.log(`Scan complete. Captured ${totalFrames} frames over ${elapsedTimeSec.toFixed(2)}s. Approx FPS: ${actualFps.toFixed(2)}`);
            
            const numCells = CONFIG.gridSize * CONFIG.gridSize;
            const fftSize = nextPowerOf2(totalFrames); // Pad to power of 2
            
            let globalPeakFrequency = 0;
            let globalMaxAmplitude = 0;
            state.failingCells = [];

            // Analyze each grid cell individually
            for (let cell = 0; cell < numCells; cell++) {
                const signal = state.timeSeriesData[cell];
                
                // 1. Calculate Mean for DC Removal (Detrending)
                let sum = 0;
                for (let i = 0; i < totalFrames; i++) sum += signal[i];
                const mean = sum / totalFrames;
                
                // 2. Prepare Real and Imaginary arrays padded to fftSize
                const real = new Float64Array(fftSize);
                const imag = new Float64Array(fftSize);
                
                for (let i = 0; i < fftSize; i++) {
                    if (i < totalFrames) {
                        // Apply Hanning Window to reduce spectral leakage
                        const multiplier = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (totalFrames - 1)));
                        real[i] = (signal[i] - mean) * multiplier;
                    } else {
                        real[i] = 0; // Zero padding
                    }
                    imag[i] = 0;
                }
                
                // 3. Execute FFT
                computeFFT(real, imag);
                
                // 4. Calculate Magnitudes & find peaks within target frequency range
                let cellMaxAmp = 0;
                let cellPeakFreq = 0;
                
                // Only loop through first half (Nyquist limit)
                for (let i = 1; i < fftSize / 2; i++) {
                    const frequency = i * (actualFps / fftSize);
                    
                    // Filter frequencies based on config (and physical Nyquist limitation)
                    if (frequency >= CONFIG.freqMin && frequency <= CONFIG.freqMax && frequency <= actualFps/2) {
                        const magnitude = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]);
                        // Normalize magnitude by N
                        const normalizedMag = magnitude / (totalFrames / 2);
                        
                        if (normalizedMag > cellMaxAmp) {
                            cellMaxAmp = normalizedMag;
                            cellPeakFreq = frequency;
                        }
                    }
                }
                
                // Track global maximums for logging
                if (cellMaxAmp > globalMaxAmplitude) {
                    globalMaxAmplitude = cellMaxAmp;
                    globalPeakFrequency = cellPeakFreq;
                }
                
                // 5. Threshold Detection
                if (cellMaxAmp > CONFIG.anomalyThreshold) {
                    state.failingCells.push({
                        index: cell,
                        amplitude: cellMaxAmp,
                        frequency: cellPeakFreq
                    });
                }
            }

            // Evaluation
            const isAnomaly = state.failingCells.length > 0;
            state.scanResult = {
                status: isAnomaly ? 'FAIL' : 'PASS',
                peakFrequency: isAnomaly ? globalPeakFrequency.toFixed(2) : '0.00',
                maxAmplitude: globalMaxAmplitude.toFixed(2),
                failingCount: state.failingCells.length
            };

            logResultToDatabase(state.scanResult);
            finalizeScanUI(isAnomaly);
        }

        /**
         * Local Storage Logging
         */
        function logResultToDatabase(result) {
            const logEntry = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                status: result.status,
                peakFrequencyHz: parseFloat(result.peakFrequency),
                maxAmplitude: parseFloat(result.maxAmplitude)
            };

            let logs = [];
            try {
                const stored = localStorage.getItem('vibration_scan_logs');
                if (stored) logs = JSON.parse(stored);
            } catch(e) {}
            
            logs.push(logEntry);
            localStorage.setItem('vibration_scan_logs', JSON.stringify(logs));
            console.log("Scan logged to local database:", logEntry);
        }

        /**
         * Frame Rendering & Capture Loop
         */
        function renderLoop(timestamp) {
            if (!state.cameraStream) return;

            const w = canvas.width;
            const h = canvas.height;
            
            // Calculate Targeting Box Dimensions
            const boxW = w * CONFIG.targetBoxRatio;
            const boxH = h * CONFIG.targetBoxRatio;
            const boxX = (w - boxW) / 2;
            const boxY = (h - boxH) / 2;

            // 1. Draw Camera Feed
            ctx.drawImage(video, 0, 0, w, h);

            if (state.status === 'SCANNING') {
                const elapsed = timestamp - state.scanStartTime;
                const progress = Math.min((elapsed / CONFIG.scanDurationMs) * 100, 100);
                progressBar.style.width = `${progress}%`;

                // Capture Image Data in Targeting Box for EVM/FFT Analysis
                const frameData = ctx.getImageData(boxX, boxY, boxW, boxH);
                extractGridIntensities(frameData, boxW, boxH);
                
                state.frameTimestamps.push(timestamp);
                state.frameCount++;

                // Draw Scanning Grid
                drawGridOverlay(boxX, boxY, boxW, boxH, 'rgba(255, 255, 255, 0.2)');
                drawTargetBox(boxX, boxY, boxW, boxH, 'var(--text-main)', false);

                if (elapsed >= CONFIG.scanDurationMs) {
                    progressBar.style.width = '0%';
                    analyzeData();
                } else {
                    requestAnimationFrame(renderLoop);
                }

            } else if (state.status === 'IDLE' || state.status === 'INIT') {
                // Draw Idle Targeting Box
                drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-neutral)', false);
                requestAnimationFrame(renderLoop);
                
            } else if (state.status === 'RESULT') {
                // Persistent Result Render (No further requestAnimationFrame here)
                if (state.scanResult.status === 'FAIL') {
                    // Darken background
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fillRect(0, 0, w, h);
                    
                    // Highlight the target area normally
                    ctx.drawImage(video, boxX, boxY, boxW, boxH, boxX, boxY, boxW, boxH);
                    
                    // Draw red box around anomalies
                    drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-danger)', true);
                    drawAnomalies(boxX, boxY, boxW, boxH);
                } else {
                    drawTargetBox(boxX, boxY, boxW, boxH, 'var(--accent-success)', false);
                }
            }
        }

        /**
         * Extract Grayscale Intensities from the frame data for each grid block
         */
        function extractGridIntensities(imageData, width, height) {
            const data = imageData.data;
            const cellW = width / CONFIG.gridSize;
            const cellH = height / CONFIG.gridSize;
            
            // Temporary accumulators for this frame
            const cellSums = new Float64Array(CONFIG.gridSize * CONFIG.gridSize);
            const cellCounts = new Uint32Array(CONFIG.gridSize * CONFIG.gridSize);

            // Loop through all pixels in the target box
            for (let y = 0; y < height; y++) {
                const gridY = Math.floor(y / cellH);
                if (gridY >= CONFIG.gridSize) continue;
                
                for (let x = 0; x < width; x++) {
                    const gridX = Math.floor(x / cellW);
                    if (gridX >= CONFIG.gridSize) continue;
                    
                    const index = (y * Math.floor(width) + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    
                    // Grayscale conversion (Luma)
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    
                    const cellIndex = gridY * CONFIG.gridSize + gridX;
                    cellSums[cellIndex] += gray;
                    cellCounts[cellIndex]++;
                }
            }

            // Average and store in time-series buffer
            for (let i = 0; i < cellSums.length; i++) {
                const avg = cellSums[i] / cellCounts[i];
                state.timeSeriesData[i].push(avg);
            }
        }

        /**
         * Canvas Drawing Helpers
         */
        function drawTargetBox(x, y, w, h, color, glowing) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            
            if (glowing) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
            } else {
                ctx.shadowBlur = 0;
            }
            
            // Draw corner brackets
            const cornerLength = 30;
            ctx.beginPath();
            // Top Left
            ctx.moveTo(x, y + cornerLength);
            ctx.lineTo(x, y);
            ctx.lineTo(x + cornerLength, y);
            // Top Right
            ctx.moveTo(x + w - cornerLength, y);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w, y + cornerLength);
            // Bottom Right
            ctx.moveTo(x + w, y + h - cornerLength);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x + w - cornerLength, y + h);
            // Bottom Left
            ctx.moveTo(x + cornerLength, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + h - cornerLength);
            ctx.stroke();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function drawGridOverlay(x, y, w, h, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const stepX = w / CONFIG.gridSize;
            const stepY = h / CONFIG.gridSize;
            
            for (let i = 1; i < CONFIG.gridSize; i++) {
                // Vertical lines
                ctx.moveTo(x + i * stepX, y);
                ctx.lineTo(x + i * stepX, y + h);
                // Horizontal lines
                ctx.moveTo(x, y + i * stepY);
                ctx.lineTo(x + w, y + i * stepY);
            }
            ctx.stroke();
        }

        function drawAnomalies(x, y, w, h) {
            const cellW = w / CONFIG.gridSize;
            const cellH = h / CONFIG.gridSize;
            
            ctx.strokeStyle = 'var(--accent-danger)';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'var(--accent-danger)';
            ctx.shadowBlur = 10;
            ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
            
            for (const cell of state.failingCells) {
                const gridX = cell.index % CONFIG.gridSize;
                const gridY = Math.floor(cell.index / CONFIG.gridSize);
                
                const rectX = x + (gridX * cellW);
                const rectY = y + (gridY * cellH);
                
                ctx.fillRect(rectX, rectY, cellW, cellH);
                ctx.strokeRect(rectX, rectY, cellW, cellH);
                
                // Draw crosshair center
                ctx.beginPath();
                ctx.moveTo(rectX + cellW/2, rectY + cellH/2 - 5);
                ctx.lineTo(rectX + cellW/2, rectY + cellH/2 + 5);
                ctx.moveTo(rectX + cellW/2 - 5, rectY + cellH/2);
                ctx.lineTo(rectX + cellW/2 + 5, rectY + cellH/2);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        /**
         * UI State Transitions
         */
        function startScan() {
            if (state.status !== 'IDLE' && state.status !== 'RESULT') return;
            
            // Reset state
            state.status = 'SCANNING';
            sysStatus.innerText = 'SCAN IN PROGRESS...';
            startBtn.disabled = true;
            statusOverlay.style.display = 'none';
            
            state.frameCount = 0;
            state.frameTimestamps = [];
            state.scanStartTime = performance.now();
            
            // Initialize empty arrays for time series data
            const numCells = CONFIG.gridSize * CONFIG.gridSize;
            state.timeSeriesData = Array.from({ length: numCells }, () => []);
            
            // Re-ignite animation frame if coming from RESULT
            requestAnimationFrame(renderLoop);
        }

        function finalizeScanUI(isAnomaly) {
            state.status = 'RESULT';
            sysStatus.innerText = isAnomaly ? 'ANOMALY DETECTED' : 'SYSTEM OPTIMAL';
            sysStatus.style.color = isAnomaly ? 'var(--accent-danger)' : 'var(--accent-success)';
            
            statusOverlay.style.display = 'block';
            statusOverlay.style.color = isAnomaly ? 'var(--accent-danger)' : 'var(--accent-success)';
            statusOverlay.style.borderColor = isAnomaly ? 'var(--accent-danger)' : 'var(--accent-success)';
            
            if (isAnomaly) {
                statusOverlay.innerHTML = `⚠️ CRITICAL ANOMALY DETECTED IN ISOLATED REGION<br>Peak Hz: ${state.scanResult.peakFrequency} | Mag: ${state.scanResult.maxAmplitude}`;
            } else {
                statusOverlay.innerHTML = `✓ STATUS: OPTIMAL<br>No anomalous vibrations detected.`;
            }

            startBtn.disabled = false;
            startBtn.innerText = "Initiate New Scan";
        }

        /**
         * Event Listeners & Bootstrap
         */
        startBtn.addEventListener('click', startScan);
        window.addEventListener('load', initCamera);

    </script>
</body>
</html>
