<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Appliance Diagnostic Scanner</title>
    <style>
        /* 
         * STRICT UI/UX DESIGN RULES 
         * Stealth, military-grade, professional.
         * Matte Black/Charcoal. NO NEON. NO GLOW.
         */
        :root {
            --bg-base: #0f1011;
            --bg-panel: #1a1b1d;
            --text-main: #d1d5db;
            --text-muted: #6b7280;
            --border-matte: #374151;
            
            /* Specific State Matte Colors */
            --color-state-1: #4b5563; /* Matte Dark Grey */
            --color-state-2: #1e3a5f; /* Deep Matte Blue */
            --color-state-3: #9a4d1c; /* Matte Orange */
            --color-state-4: #a16b00; /* Solid Amber */
            --color-state-5: #7b1e1e; /* Deep Matte Red */
            --color-optimal: #2b5f3a; /* Muted Green */

            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        header {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 10;
        }

        header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #f3f4f6;
        }

        header p {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Video / Canvas Container */
        #scanner-viewport {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background-color: #000;
            border: 2px solid var(--border-matte);
            overflow: hidden;
        }

        video {
            display: none; /* Drawn strictly to canvas */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UI Overlays */
        #shake-warning {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--color-state-3);
            color: #fff;
            padding: 6px 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: none;
            z-index: 20;
        }

        #sensor-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-align: right;
            z-index: 10;
        }

        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--bg-panel);
            z-index: 15;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--text-muted);
            transition: width 0.1s linear;
        }

        /* Result Diagnostics Overlay */
        #diagnostic-result {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-panel);
            border: 2px solid var(--border-matte);
            padding: 16px 24px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 30;
            min-width: 350px;
        }

        .tick-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        #diagnostic-text {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Controls */
        #controls {
            margin-top: 32px;
            z-index: 10;
        }

        button {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-matte);
            padding: 12px 24px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-main);
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--border-matte);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>Appliance Multi-Sensor Scanner</h1>
        <p>OPTICAL EVM | ACOUSTIC | EMF | ACCEL</p>
    </header>

    <div id="scanner-viewport">
        <video id="vid-feed" autoplay playsinline muted></video>
        <canvas id="render-canvas"></canvas>
        
        <div id="shake-warning">OPTICAL ANCHOR LOST: PAUSING SCAN</div>
        <div id="sensor-hud">
            MIC: <span id="hud-mic">STANDBY</span><br>
            EMF: <span id="hud-emf">0.0 µT</span>
        </div>
        
        <div id="progress-bar-container"><div id="progress-bar"></div></div>

        <!-- Matte result overlay strictly rendering on completion -->
        <div id="diagnostic-result">
            <svg class="tick-icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <div id="diagnostic-text"></div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-scan">Start Multi-Sensor Scan</button>
    </div>

    <script>
        /**
         * ==========================================
         * CONFIGURATION & SYSTEM THRESHOLDS
         * Heavily commented for manual tuning.
         * ==========================================
         */
        const CONFIG = {
            scanDuration: 7000,          // 7-second continuous scan
            gridSize: 20,                // 20x20 analysis grid (400 blocks)
            targetRatio: 0.5,            // Targeting box takes up 50% of viewport
            
            // Optical EVM Thresholds
            freqMin: 5,                  // Target minimum vibration Hz
            freqMax: 30,                 // Target maximum vibration Hz
            evmStaticLimit: 1.5,         // Below this magnitude = "NOT MOVING" (0Hz)
            evmBaseLimit: 4.5,           // Normal baseline vibration threshold
            evmCriticalLimit: 12.0,      // Massive amplitude spike threshold
            
            // Web Audio Thresholds (Amplitudes 0-255)
            humThreshold: 140,           // Sustained 50/60Hz electrical hum threshold
            knockThreshold: 85,          // Variance/Peaks in 100-400Hz (clicking)
            whineThreshold: 110,         // Amplitude in 2-4kHz range (bearing wear)
            grindThreshold: 90,          // Broadband baseline elevation across all bins
            
            // Sensors
            emfSpikeThreshold: 45.0,     // Microteslas (µT) spike logic for Locked Rotor
            shakeThreshold: 2.5          // Acceleration delta (m/s²) to trigger optical anchoring
        };

        const state = {
            status: 'IDLE', // IDLE, SCANNING, RESULT
            stream: null,
            audioCtx: null,
            analyser: null,
            magSensor: null,
            
            // Tracking Variables
            scanStartTime: 0,
            frameCount: 0,
            elapsedTimeMs: 0,
            lastTimestamp: 0,
            lastFrameData: null,
            
            // Anti-Shake
            isShaking: false,
            lastAccel: { x: null, y: null, z: null },

            // Time-Series Buffers
            evmBuffer: [],    // 2D Array: [400 blocks][frames]
            audioBuffer: [],  // Array of FFT arrays per frame
            emfBuffer: [],    // Array of µT readings
            
            // Target Result
            resultData: {}
        };

        // DOM Pointers
        const video = document.getElementById('vid-feed');
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const btnScan = document.getElementById('btn-scan');
        const shakeWarning = document.getElementById('shake-warning');
        const hudMic = document.getElementById('hud-mic');
        const hudEmf = document.getElementById('hud-emf');
        const progressBar = document.getElementById('progress-bar');
        const diagResult = document.getElementById('diagnostic-result');
        const diagText = document.getElementById('diagnostic-text');

        /**
         * ==========================================
         * HARDWARE SENSOR INITIALIZATION
         * ==========================================
         */
        async function initSensors() {
            try {
                // 1. WebRTC Camera
                const vidConstraints = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
                state.stream = await navigator.mediaDevices.getUserMedia(vidConstraints);
                video.srcObject = state.stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                console.error("Camera access failed:", err);
                alert("Camera permission is required.");
            }

            // 2. Audio Context (Needs user gesture - handled in startScan)
            // 3. Magnetometer (EMF)
            try {
                if ('Magnetometer' in window) {
                    // Requires secure context and feature policy
                    state.magSensor = new Magnetometer({ frequency: 10 });
                    state.magSensor.start();
                } else {
                    console.warn("Magnetometer API not supported on this device.");
                }
            } catch (err) {
                console.warn("Magnetometer initialization failed.", err);
            }

            // 4. DeviceMotion (Anti-Shake / Optical Anchoring)
            // iOS 13+ requires explicit permission request
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                // We will request this on button click
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        // Calculate delta acceleration to identify hand shakes
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc || acc.x === null) return;

            if (state.lastAccel.x !== null) {
                const dx = acc.x - state.lastAccel.x;
                const dy = acc.y - state.lastAccel.y;
                const dz = acc.z - state.lastAccel.z;
                const delta = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                state.isShaking = (delta > CONFIG.shakeThreshold);
            }
            state.lastAccel = { x: acc.x, y: acc.y, z: acc.z };
        }

        /**
         * ==========================================
         * RENDER & CAPTURE LOOP
         * ==========================================
         */
        function renderLoop(timestamp) {
            if (!state.stream) return;

            const w = canvas.width;
            const h = canvas.height;
            const boxW = w * CONFIG.targetRatio;
            const boxH = h * CONFIG.targetRatio;
            const boxX = (w - boxW) / 2;
            const boxY = (h - boxH) / 2;

            if (state.status === 'IDLE') {
                ctx.drawImage(video, 0, 0, w, h);
                drawMatteGrid(boxX, boxY, boxW, boxH, 'rgba(107, 114, 128, 0.4)'); // Matte grey targeting
                requestAnimationFrame(renderLoop);
                return;
            }

            if (state.status === 'SCANNING') {
                ctx.drawImage(video, 0, 0, w, h);
                state.lastFrameData = canvas; // Cache for freeze frame

                const totalElapsed = timestamp - state.scanStartTime;
                progressBar.style.width = Math.min((totalElapsed / CONFIG.scanDuration) * 100, 100) + '%';

                // Real-time EMF Update
                let currentEMF = 0;
                if (state.magSensor && state.magSensor.x) {
                    currentEMF = Math.sqrt(state.magSensor.x**2 + state.magSensor.y**2 + state.magSensor.z**2);
                    hudEmf.innerText = currentEMF.toFixed(1) + ' µT';
                }

                if (state.isShaking) {
                    shakeWarning.style.display = 'block';
                    // PAUSE PIXEL DATA COLLECTION (Optical Anchoring)
                } else {
                    shakeWarning.style.display = 'none';
                    
                    // 1. Process Optical Frame Data
                    const frameData = ctx.getImageData(boxX, boxY, boxW, boxH);
                    extractLumaGrid(frameData, boxW, boxH);
                    
                    // 2. Process Audio Data
                    if (state.analyser) {
                        const freqData = new Uint8Array(state.analyser.frequencyBinCount);
                        state.analyser.getByteFrequencyData(freqData);
                        state.audioBuffer.push(freqData);
                        
                        // Simple HUD visualizer max volume
                        const maxVol = Math.max(...freqData);
                        hudMic.innerText = maxVol > 10 ? 'ACTIVE' : 'IDLE';
                    }

                    // 3. Process EMF Data
                    state.emfBuffer.push(currentEMF);

                    if (state.lastTimestamp !== 0) {
                        state.elapsedTimeMs += (timestamp - state.lastTimestamp);
                    }
                    state.lastTimestamp = timestamp;
                    state.frameCount++;
                }

                drawMatteGrid(boxX, boxY, boxW, boxH, 'rgba(154, 77, 28, 0.4)'); // Scanning active color (muted)

                if (totalElapsed >= CONFIG.scanDuration) {
                    progressBar.style.width = '0%';
                    shakeWarning.style.display = 'none';
                    state.status = 'ANALYZING';
                    analyzeSensorFusionData(boxX, boxY, boxW, boxH);
                } else {
                    requestAnimationFrame(renderLoop);
                }
            }
        }

        // Grayscale (Luma) Extraction for EVM
        function extractLumaGrid(imgData, w, h) {
            const data = imgData.data;
            const bW = w / CONFIG.gridSize;
            const bH = h / CONFIG.gridSize;
            const numBlocks = CONFIG.gridSize * CONFIG.gridSize;
            
            const sums = new Float64Array(numBlocks);
            const counts = new Uint32Array(numBlocks);

            for (let y = 0; y < h; y++) {
                const gy = Math.floor(y / bH);
                if (gy >= CONFIG.gridSize) continue;
                for (let x = 0; x < w; x++) {
                    const gx = Math.floor(x / bW);
                    if (gx >= CONFIG.gridSize) continue;
                    
                    const idx = (y * Math.floor(w) + x) * 4;
                    // Luma formula
                    const luma = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
                    
                    const blockIdx = gy * CONFIG.gridSize + gx;
                    sums[blockIdx] += luma;
                    counts[blockIdx]++;
                }
            }

            for (let i = 0; i < numBlocks; i++) {
                state.evmBuffer[i].push(sums[i] / counts[i]);
            }
        }

        /**
         * ==========================================
         * PURE JS MATHEMATICS (FFT)
         * ==========================================
         */
        function computeFFT(real, imag) {
            const n = real.length;
            for (let i = 0, j = 0; i < n; i++) {
                if (j > i) {
                    let tR = real[i], tI = imag[i];
                    real[i] = real[j]; imag[i] = imag[j];
                    real[j] = tR; imag[j] = tI;
                }
                let m = n >> 1;
                while (m >= 1 && j >= m) { j -= m; m >>= 1; }
                j += m;
            }

            for (let size = 2; size <= n; size *= 2) {
                const half = size / 2;
                const angle = -2 * Math.PI / size;
                const wRe = Math.cos(angle), wIm = Math.sin(angle);
                for (let i = 0; i < n; i += size) {
                    let uRe = 1, uIm = 0;
                    for (let j = 0; j < half; j++) {
                        const id = i + j;
                        const idH = id + half;
                        const tRe = uRe * real[idH] - uIm * imag[idH];
                        const tIm = uRe * imag[idH] + uIm * real[idH];
                        
                        real[idH] = real[id] - tRe;
                        imag[idH] = imag[id] - tIm;
                        real[id] += tRe;
                        imag[id] += tIm;
                        
                        const nRe = uRe * wRe - uIm * wIm;
                        uIm = uRe * wIm + uIm * wRe;
                        uRe = nRe;
                    }
                }
            }
        }

        function nextPow2(n) { return Math.pow(2, Math.ceil(Math.log2(n))); }

        /**
         * ==========================================
         * SENSOR FUSION & DIAGNOSTIC LOGIC
         * Mapping to exact states as requested.
         * ==========================================
         */
        function analyzeSensorFusionData(boxX, boxY, boxW, boxH) {
            const numFrames = state.frameCount;
            if (numFrames < 20) {
                alert("Scan failed: excessive shaking.");
                resetScan();
                return;
            }

            const actualFps = numFrames / (state.elapsedTimeMs / 1000);
            const numBlocks = CONFIG.gridSize * CONFIG.gridSize;
            const fftSize = nextPow2(numFrames);

            // --- 1. OPTICAL EVM ANALYSIS ---
            let maxGlobalAmp = 0;
            let targetBlock = Math.floor(numBlocks / 2); // default center
            
            for (let b = 0; b < numBlocks; b++) {
                const sig = state.evmBuffer[b];
                const mean = sig.reduce((a, v) => a + v, 0) / numFrames;
                const real = new Float64Array(fftSize);
                const imag = new Float64Array(fftSize);
                
                for (let i = 0; i < fftSize; i++) {
                    if (i < numFrames) {
                        // Hanning Window
                        real[i] = (sig[i] - mean) * (0.5 * (1 - Math.cos(2*Math.PI*i/(numFrames-1))));
                    }
                }
                
                computeFFT(real, imag);
                
                let blockMax = 0;
                for (let i = 1; i < fftSize / 2; i++) {
                    const f = i * (actualFps / fftSize);
                    if (f >= CONFIG.freqMin && f <= CONFIG.freqMax) {
                        const mag = Math.sqrt(real[i]**2 + imag[i]**2) / (numFrames/2) * 2;
                        if (mag > blockMax) blockMax = mag;
                    }
                }
                
                if (blockMax > maxGlobalAmp) {
                    maxGlobalAmp = blockMax;
                    targetBlock = b;
                }
            }

            // --- 2. AUDIO ANALYSIS (Web Audio API) ---
            // Analyser setup: sample rate usually 44100 or 48000. fftSize=2048. Bin ~ 21.5Hz
            let bin50_60 = 0;   // hum
            let bin100_400 = 0; // knock/click
            let binHigh = 0;    // whine
            let totalAmp = 0;   // grind (broadband)

            if (state.audioBuffer.length > 0) {
                const audFrames = state.audioBuffer.length;
                const binCount = state.analyser.frequencyBinCount;
                const binHz = state.audioCtx.sampleRate / state.analyser.fftSize;

                let humSum = 0, knockSum = 0, whineSum = 0, grindSum = 0;
                
                for (let i = 0; i < audFrames; i++) {
                    let frameTotal = 0;
                    for (let j = 0; j < binCount; j++) {
                        const hz = j * binHz;
                        const val = state.audioBuffer[i][j];
                        
                        if (hz >= 45 && hz <= 65) humSum += val;
                        if (hz >= 100 && hz <= 400) knockSum += val;
                        if (hz >= 2000 && hz <= 4000) whineSum += val;
                        frameTotal += val;
                    }
                    grindSum += (frameTotal / binCount); // avg frame volume
                }
                
                bin50_60 = humSum / (audFrames * 2); // approx 2 bins
                bin100_400 = knockSum / (audFrames * 14); // approx 14 bins
                binHigh = whineSum / (audFrames * 90); 
                totalAmp = grindSum / audFrames;
            }

            // --- 3. EMF ANALYSIS ---
            let maxEmf = state.emfBuffer.length > 0 ? Math.max(...state.emfBuffer) : 0;

            // --- 4. STATE MAPPING DECISION TREE ---
            let finalStateId = 0;
            let finalColor = 'var(--color-optimal)';
            let finalDiagText = "STATUS: Optimal. No anomalies.";
            
            const IS_MOVING = maxGlobalAmp >= CONFIG.evmStaticLimit;

            if (!IS_MOVING) {
                // A. Machine is OFF or JAMMED (0Hz Camera movement)
                targetBlock = Math.floor(numBlocks / 2); // Force center box if no movement
                if (bin50_60 > CONFIG.humThreshold && maxEmf > CONFIG.emfSpikeThreshold) {
                    finalStateId = 2;
                    finalColor = 'var(--color-state-2)';
                    finalDiagText = "CRITICAL: Locked Rotor. Turn off immediately.";
                } else {
                    finalStateId = 1;
                    finalColor = 'var(--color-state-1)';
                    finalDiagText = "DIAGNOSIS: No Power. Wire cut or burnt coil.";
                }
            } else {
                // B. Machine is MOVING (5Hz-30Hz vibration detected)
                if (maxGlobalAmp > CONFIG.evmCriticalLimit && totalAmp > CONFIG.grindThreshold) {
                    finalStateId = 5;
                    finalColor = 'var(--color-state-5)';
                    finalDiagText = "CRITICAL: Severe structural imbalance.";
                } else if (maxGlobalAmp > CONFIG.evmBaseLimit && binHigh > CONFIG.whineThreshold) {
                    finalStateId = 4;
                    finalColor = 'var(--color-state-4)';
                    finalDiagText = "Alert: Bearing Wear. Expected failure soon.";
                } else if (bin100_400 > CONFIG.knockThreshold) {
                    finalStateId = 3;
                    finalColor = 'var(--color-state-3)';
                    finalDiagText = "Warning: Physical Obstruction hitting blade.";
                }
            }

            state.resultData = {
                timestamp: new Date().toISOString(),
                state: finalStateId,
                primaryFrequencyHz: IS_MOVING ? "5-30Hz" : "0Hz",
                emfLevel: maxEmf.toFixed(1) + " µT"
            };

            logToStorage(state.resultData);
            renderFinalOutput(boxX, boxY, boxW, boxH, targetBlock, finalColor, finalDiagText);
        }

        /**
         * ==========================================
         * FINAL CAPTURE DRAWING & LOGGING
         * ==========================================
         */
        function renderFinalOutput(bX, bY, bW, bH, targetIdx, boxColor, textStr) {
            state.status = 'RESULT';
            const w = canvas.width;
            const h = canvas.height;
            
            // 1. Freeze Video Frame (draw last cached video frame)
            ctx.drawImage(video, 0, 0, w, h);

            // 2. Draw target bounding box strictly over the isolated grid coordinate
            const bw = bW / CONFIG.gridSize;
            const bh = bH / CONFIG.gridSize;
            const gy = Math.floor(targetIdx / CONFIG.gridSize);
            const gx = targetIdx % CONFIG.gridSize;
            
            const rectX = bX + (gx * bw);
            const rectY = bY + (gy * bh);

            // Matte Solid Rect Drawing (NO GLOW/NEON)
            ctx.strokeStyle = boxColor;
            ctx.lineWidth = 4;
            ctx.strokeRect(rectX, rectY, bw, bh);
            ctx.fillStyle = boxColor;
            ctx.globalAlpha = 0.3; // Slight matte fill
            ctx.fillRect(rectX, rectY, bw, bh);
            ctx.globalAlpha = 1.0;

            // Optional crosshair within the box
            ctx.beginPath();
            ctx.moveTo(rectX + bw/2, rectY + bh/2 - 6);
            ctx.lineTo(rectX + bw/2, rectY + bh/2 + 6);
            ctx.moveTo(rectX + bw/2 - 6, rectY + bh/2);
            ctx.lineTo(rectX + bw/2 + 6, rectY + bh/2);
            ctx.stroke();

            // 3. Show Diagnostic HTML Overlay with icon
            diagResult.style.display = 'flex';
            diagResult.style.borderColor = boxColor;
            diagText.innerText = textStr;
            
            btnScan.disabled = false;
            btnScan.innerText = "Initialize New Scan";
        }

        function drawMatteGrid(x, y, w, h, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            const sx = w / CONFIG.gridSize;
            const sy = h / CONFIG.gridSize;
            for (let i = 1; i < CONFIG.gridSize; i++) {
                ctx.moveTo(x + i*sx, y); ctx.lineTo(x + i*sx, y + h);
                ctx.moveTo(x, y + i*sy); ctx.lineTo(x + w, y + i*sy);
            }
            ctx.stroke();
            
            // Outer bounding box
            ctx.strokeStyle = '#555';
            ctx.strokeRect(x, y, w, h);
        }

        function logToStorage(data) {
            let logs = [];
            try {
                const stored = localStorage.getItem('appliance_diagnostics');
                if (stored) logs = JSON.parse(stored);
            } catch(e) {}
            logs.push(data);
            localStorage.setItem('appliance_diagnostics', JSON.stringify(logs));
        }

        function resetScan() {
            state.status = 'IDLE';
            btnScan.disabled = false;
            diagResult.style.display = 'none';
            progressBar.style.width = '0%';
            requestAnimationFrame(renderLoop);
        }

        /**
         * ==========================================
         * EVENTS & BOOTSTRAP
         * ==========================================
         */
        btnScan.addEventListener('click', async () => {
            if (state.status !== 'IDLE' && state.status !== 'RESULT') return;

            // Setup Audio Context on User Gesture (Browser Policy)
            if (!state.audioCtx) {
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = state.audioCtx.createMediaStreamSource(audioStream);
                    state.analyser = state.audioCtx.createAnalyser();
                    state.analyser.fftSize = 2048;
                    src.connect(state.analyser);
                } catch(e) {
                    console.warn("Microphone access denied. Audio checks will fail/default to 0.");
                }
            }

            // Setup DeviceMotion permission for iOS 13+
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceMotionEvent.requestPermission();
                    if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
                } catch (e) { console.warn("DeviceMotion denied."); }
            }

            // Reset buffers
            state.evmBuffer = Array.from({ length: 400 }, () => []);
            state.audioBuffer = [];
            state.emfBuffer = [];
            
            state.frameCount = 0;
            state.elapsedTimeMs = 0;
            state.lastTimestamp = 0;
            state.scanStartTime = performance.now();
            
            state.status = 'SCANNING';
            btnScan.disabled = true;
            diagResult.style.display = 'none';
            
            if (state.status === 'RESULT') requestAnimationFrame(renderLoop); // Kickstart if stopped
        });

        window.addEventListener('load', initSensors);
    </script>
</body>
</html>
